# XcodeGen spec. From this folder:
#
#     xcodegen generate
#     open AmICompromised.xcodeproj
#
# One app for iPhone, iPad and (in v2) Mac, sold as a single Universal
# Purchase. The detection engine lives in Packages/CompromiseKit.

name: AmICompromised

options:
  bundleIdPrefix: com.techbitsmix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  CompromiseKit:
    path: Packages/CompromiseKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: XNGW97HPY6

targets:
  AmICompromised:
    type: application
    platform: iOS
    scheme:
      storeKitConfiguration: Config/AmICompromised.storekit
      testTargets:
        - AmICompromisedTests
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CompromiseKit
      - target: ScanAction
    info:
      path: App/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        SKIncludeConsumableInAppPurchaseHistory: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sysdiagnose archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.tar-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techbitsmix.AmICompromised
        PRODUCT_NAME: AmICompromised
        CODE_SIGN_ENTITLEMENTS: Config/AmICompromised.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # The native Mac app covers the Mac; the iPhone build there would
        # check the wrong machine.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Am I Compromised?
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 TechBitsMix
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ScanAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ScanAction
    dependencies:
      - package: CompromiseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techbitsmix.AmICompromised.ScanAction
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Config/ScanAction-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/ScanAction.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Mac App Store build: sandboxed, same bundle ID as iOS for Universal
  # Purchase.
  AmICompromisedMac:
    type: application
    scheme:
      storeKitConfiguration: Config/AmICompromised.storekit
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: CompromiseKit
    info:
      path: Config/Mac-Info.plist
      properties:
        SKIncludeConsumableInAppPurchaseHistory: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Am I Compromised
        PRODUCT_MODULE_NAME: AmICompromisedMac
        INFOPLIST_KEY_CFBundleDisplayName: Am I Compromised?
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 TechBitsMix
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.techbitsmix.AmICompromised
        CODE_SIGN_ENTITLEMENTS: Config/Mac-AppStore.entitlements

  # Free direct download (Developer ID, notarized): full Mac scan and USB
  # backup. Not sandboxed, so it can't go in the Mac App Store.
  AmICompromisedMacDirect:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: CompromiseKit
    info:
      path: Config/Mac-Info.plist
      properties:
        SKIncludeConsumableInAppPurchaseHistory: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: Am I Compromised
        PRODUCT_MODULE_NAME: AmICompromisedMac
        INFOPLIST_KEY_CFBundleDisplayName: Am I Compromised?
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 TechBitsMix
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.techbitsmix.AmICompromised.direct
        PRODUCT_NAME: Am I Compromised Full
        CODE_SIGN_ENTITLEMENTS: Config/Mac-Direct.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FULL_SCAN

  AmICompromisedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: Config/AmICompromised.storekit
        buildPhase: resources
    dependencies:
      - target: AmICompromised
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techbitsmix.AmICompromisedTests
        GENERATE_INFOPLIST_FILE: YES
