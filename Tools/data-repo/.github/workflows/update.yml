# Workflow for the public data repo (shiftingeden/AmICompromised-data).
# Regenerates apple-kev.json daily and commits it only if the bug list changed.
name: Update exploited-bug catalog
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 generate_apple_kev.py apple-kev.json
      - run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add apple-kev.json
          git diff --cached --quiet || git commit -m "Update apple-kev.json"
          git push
