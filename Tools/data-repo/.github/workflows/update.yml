# Workflow for the public data repo (shiftingeden/AmICompromised-data).
# Regenerates apple-kev.json and the optional extra lists daily, and commits
# only what changed.
name: Update exploited-bug catalog and extra lists
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 generate_apple_kev.py apple-kev.json
      - run: python3 generate_extra_indicators.py .
      - run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add apple-kev.json extra-indicators.yaml extra
          git diff --cached --quiet || git commit -m "Update catalog and extra lists"
          git push
